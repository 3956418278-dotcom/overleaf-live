<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="olPaper" x1="20" y1="16" x2="90" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="olFold" x1="68" y1="16" x2="90" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="olPulse" x1="31" y1="53" x2="78" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="olBadge" x1="64" y1="64" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Crisp folded LaTeX document page (bounds: 18.9..91.1 x 14.9..105.1) -->
  <path
    d="M 30 16 H 68 L 90 38 V 94 A 10 10 0 0 1 80 104 H 30 A 10 10 0 0 1 20 94 V 26 A 10 10 0 0 1 30 16 Z"
    fill="url(#olPaper)"
    stroke="#0f766e"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Subtle fold shadow -->
  <path
    d="M 68 38 H 90 V 43 L 73 43 A 5 5 0 0 1 68 38 Z"
    fill="#0f766e"
    fill-opacity="0.16"
  />

  <!-- Top-right teal page fold -->
  <path
    d="M 68 16 V 32 A 6 6 0 0 0 74 38 H 90 L 68 16 Z"
    fill="url(#olFold)"
    stroke="#0f766e"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- LaTeX source heading bar -->
  <rect x="31" y="32" width="27" height="5.5" rx="2.75" fill="#0f766e" />

  <!-- Live OT sync pulse waveform across active line -->
  <path
    d="M 31 53 H 40 L 44.5 43 L 50.5 63 L 55.5 49 L 59.5 53 H 77"
    stroke="url(#olPulse)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Supporting source bars -->
  <rect x="31" y="72" width="25" height="5" rx="2.5" fill="#475569" fill-opacity="0.65" />
  <rect x="31" y="84" width="19" height="5" rx="2.5" fill="#64748b" fill-opacity="0.55" />

  <!-- High-contrast emerald/teal live sync medallion (bounds: 60.5..111.5) -->
  <circle cx="86" cy="86" r="25.5" fill="#064e3b" />
  <circle
    cx="86"
    cy="86"
    r="24"
    fill="url(#olBadge)"
    stroke="#ecfdf5"
    stroke-width="2.2"
  />

  <!-- Subtle inner live-sync orbit arc -->
  <path
    d="M 69 81 A 17.5 17.5 0 0 1 88 68.6"
    stroke="#a7f3d0"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Overleaf-inspired botanical leaf emblem -->
  <path
    d="M 98.5 72.5 C 86.5 72.5 75.5 79.5 74.5 94 C 89 94.5 98.5 85 98.5 72.5 Z"
    fill="#ffffff"
  />
  <path
    d="M 73.5 96.5 L 89 81.5"
    stroke="#047857"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
